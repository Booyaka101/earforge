name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --if-present
      - name: Test
        run: npm test --if-present
      - name: Lint
        run: npm run lint --if-present

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm-script-lens (dogfood)
        run: npx npm-script-lens .
        continue-on-error: true
      - name: runner-drift guard (dogfood)
        run: |
          git clone https://github.com/Booyaka101/runner-drift /tmp/rd
          cd /tmp/rd && npm install --no-save
          node bin/runner-drift.js init --label ubuntu-24.04
          node bin/runner-drift.js guard --lock-file /tmp/rd/runner-lock.json --workflows $GITHUB_WORKSPACE/.github/workflows/ || true
        continue-on-error: true
