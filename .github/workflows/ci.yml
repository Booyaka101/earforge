name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: python -m pip install -e . pytest httpx soundfile
      - name: Test
        run: python -m pytest -q

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm-script-lens (dogfood)
        run: npx npm-script-lens .
        continue-on-error: true
      - name: runner-drift guard (dogfood)
        run: |
          git clone https://github.com/Booyaka101/runner-drift /tmp/rd
          cd /tmp/rd && npm install --no-save
          node bin/runner-drift.js init --label ubuntu-24.04
          node bin/runner-drift.js guard --lock-file /tmp/rd/runner-lock.json --workflows $GITHUB_WORKSPACE/.github/workflows/ || true
        continue-on-error: true
