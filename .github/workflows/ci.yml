name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install CPU audio dependencies
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: python -m pip install -e . pytest httpx soundfile build twine
      - name: Test
        run: python -m pytest -q
      - name: Build and validate distributions
        run: python -m build && python -m twine check dist/*

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm-script-lens (dogfood)
        if: hashFiles('package.json') != ''
        run: npx npm-script-lens .
        continue-on-error: true
