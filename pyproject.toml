[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earforge"
version = "0.1.0"
description = "Local GPU-accelerated learn-by-ear workbench: any recording into multi-instrument MIDI, a live piano roll, and a play-along practice mixer, built on MuScriptor."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "earforge contributors" }]
keywords = [
    "music",
    "transcription",
    "midi",
    "audio",
    "piano-roll",
    "practice",
    "play-along",
    "learn-by-ear",
    "muscriptor",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "muscriptor>=0.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "typer>=0.10",
    "numpy>=1.24",
    "mido>=1.3",
]

[project.urls]
Homepage = "https://github.com/Booyaka101/earforge"
Repository = "https://github.com/Booyaka101/earforge"
Issues = "https://github.com/Booyaka101/earforge/issues"

[project.scripts]
earforge = "earforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["earforge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "soundfile>=0.12",
]

[tool.pytest.ini_options]
markers = [
    "gpu: needs CUDA, muscriptor weights and an HF_TOKEN (skipped automatically otherwise)",
]
testpaths = ["tests"]
